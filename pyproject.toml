[project]
name = "trail-cli"
version = "0.1.0"
description = "Agent-friendly HSR automation CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
trail = "trail.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trail"]
