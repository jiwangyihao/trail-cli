[project]
name = "trail-cli"
version = "0.1.0"
description = "Agent-friendly HSR automation CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pillow>=10.0",
  "pyautogui>=0.9.54",
  "pygetwindow>=0.0.9",
  "pyscreeze>=1.0.1",
  "pyyaml>=6.0",
  "pywin32>=306",
  "rapidocr-onnxruntime>=1.3.24",
  "windows-capture>=2.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
trail = "trail.cli:app"
traild = "trail.daemon.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trail"]
